<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahiya CricTrade 🏏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #facc15;
    --gold-dim: #ca9f0f;
    --green: #16a34a;
    --red: #dc2626;
    --bg: #060a06;
    --card: rgba(12, 22, 12, 0.82);
    --border: rgba(250, 204, 21, 0.22);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 30px 30px;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 16px 40px;
  }

  .wrapper {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-top: 40px;
  }

  /* ── PROFILE ── */
  .avatar-ring {
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(var(--gold), var(--green), var(--gold));
    box-shadow: 0 0 24px rgba(250,204,21,0.35);
  }
  .avatar-ring img {
    display: block;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg);
  }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(1.6rem, 6vw, 2rem);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    letter-spacing: 0.5px;
  }

  .members {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 500;
  }
  .members svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2; }

  .badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge {
    padding: 5px 16px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-green { background: rgba(22,163,74,0.25); border: 1px solid rgba(22,163,74,0.5); color: #4ade80; }
  .badge-red   { background: rgba(220,38,38,0.25); border: 1px solid rgba(220,38,38,0.5); color: #f87171; }

  /* ── STATS GRID ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat-card:hover { transform: translateY(-3px); border-color: rgba(250,204,21,0.5); }
  .stat-val { font-family: 'Rajdhani', sans-serif; font-size: 1.35rem; font-weight: 700; }
  .stat-val.gold  { color: var(--gold); }
  .stat-val.red   { color: #f87171; }
  .stat-label { font-size: 0.72rem; color: #9ca3af; margin-top: 4px; }

  /* ── CTA BUTTON ── */
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(90deg, var(--green) 0%, #15803d 40%, #b91c1c 70%, var(--red) 100%);
    box-shadow: 0 4px 24px rgba(22,163,74,0.3), 0 4px 24px rgba(220,38,38,0.2);
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .cta:hover::before { transform: translateX(100%); }
  .cta:hover { opacity: 0.93; box-shadow: 0 6px 32px rgba(22,163,74,0.45), 0 6px 32px rgba(220,38,38,0.3); }
  .cta:active { transform: scale(0.97); }
  .cta svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; flex-shrink: 0; }

  /* ── TRUST BAR ── */
  .trust {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    backdrop-filter: blur(10px);
    width: 100%;
    display: flex;
    justify-content: space-around;
  }
  .trust-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    color: #d1d5db;
    font-weight: 500;
  }
  .trust-item svg { width: 20px; height: 20px; stroke-width: 2; fill: none; }
  .t-green { stroke: #4ade80; }
  .t-gold  { stroke: var(--gold); }
  .t-red   { stroke: #f87171; }

  /* ── FOOTER ── */
  .footer { text-align: center; font-size: 0.72rem; color: #6b7280; line-height: 1.7; }
  .footer a { color: var(--gold); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .wrapper > * {
    animation: fadeUp 0.5s ease both;
  }
  .wrapper > *:nth-child(1) { animation-delay: 0.05s; }
  .wrapper > *:nth-child(2) { animation-delay: 0.10s; }
  .wrapper > *:nth-child(3) { animation-delay: 0.15s; }
  .wrapper > *:nth-child(4) { animation-delay: 0.20s; }
  .wrapper > *:nth-child(5) { animation-delay: 0.25s; }
  .wrapper > *:nth-child(6) { animation-delay: 0.30s; }
  .wrapper > *:nth-child(7) { animation-delay: 0.35s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
